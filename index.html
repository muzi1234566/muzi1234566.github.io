<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F3F2ED">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="图片压缩">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="把手机拍的照片压成能上传的 JPEG，支持 HEIC / HEIF / WebP / PNG 等。">
<title>图片压缩</title>
<style>
:root{
  --paper:#F3F2ED;
  --ink:#202929;
  --card:#FCFCFA;
  --muted:#86868b;
  --muted2:#A0A6A6;
  --line:#E9E9E4;
  --blue:#0071e3;
  --blue-soft:#E8F2FD;
  --focus:#557B79;
  --r-card:26px;
  --r-pill:999px;
  --ease:cubic-bezier(.25,.1,.25,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro SC','SF Pro Text',
    'PingFang SC','Hiragino Sans GB','Segoe UI',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  display:flex;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px
          calc(14px + env(safe-area-inset-bottom,0px));
  gap:11px;
}

/* ───── 标题 ───── */
.head{flex:none;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.head h1{
  margin:0;font-size:22px;font-weight:600;letter-spacing:-.03em;line-height:1.2;
}
.head .fmt{
  font-size:11px;color:var(--muted2);letter-spacing:.01em;
  white-space:nowrap;
}

/* ───── 上传框 ───── */
.box{
  flex:1;min-height:0;
  background:var(--card);
  border-radius:var(--r-card);
  padding:9px;
  box-shadow:0 6px 22px rgba(19,37,41,.06);
  animation:in .5s var(--ease) both;
}
.stage{
  position:relative;width:100%;height:100%;
  border-radius:19px;overflow:hidden;
  background:radial-gradient(115% 100% at 32% 4%,#EFF3F2 0%,#E4EBEA 46%,#D7E1E0 100%);
  display:grid;place-items:center;
  touch-action:none;isolation:isolate;
  cursor:pointer;
}
.stage::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:6;
  border-radius:19px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.92),
             inset 0 0 0 1px rgba(19,37,41,.055);
}
.empty{
  position:relative;z-index:2;text-align:center;padding:22px;
  pointer-events:none;
}
.empty svg{
  width:44px;height:44px;stroke:#A9B5B3;fill:none;stroke-width:1.35;
  stroke-linecap:round;stroke-linejoin:round;margin-bottom:13px;
  display:block;margin-left:auto;margin-right:auto;
}
.empty b{
  display:block;font-size:17px;font-weight:600;letter-spacing:-.02em;
  margin-bottom:5px;color:#2c3534;
}
.empty span{font-size:12.5px;color:var(--muted);line-height:1.5}
.stage.filled .empty{display:none}

.crop{
  position:absolute;z-index:4;pointer-events:none;
  border-radius:15px;
  box-shadow:0 0 0 2000px rgba(12,18,18,.48),
             inset 0 0 0 1.5px rgba(255,255,255,.85);
  transition:opacity .3s var(--ease);
  opacity:0;
}
.stage.filled .crop{opacity:1}

.busy{
  position:absolute;inset:0;z-index:8;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  background:rgba(252,252,250,.58);
  -webkit-backdrop-filter:blur(10px) saturate(1.2);
  backdrop-filter:blur(10px) saturate(1.2);
  opacity:0;transition:opacity .22s var(--ease);
}
.stage.processing .busy{display:flex;opacity:1}

/* ── 双环：外圈细轨道 + 内圈进度弧（Apple Watch 风格） ── */
.loader{
  position:relative;width:64px;height:64px;
  display:grid;place-items:center;
}
.ring{
  position:absolute;inset:0;width:64px;height:64px;
  transform:rotate(-90deg);
  overflow:visible;
}
.ring circle{
  fill:none;stroke-linecap:round;
}
.ring .track{
  stroke:rgba(0,113,227,.13);
  stroke-width:3.5;
}
.ring .arc{
  stroke:var(--blue);
  stroke-width:3.5;
  stroke-dasharray:169.65;          /* 2πr, r=27 */
  stroke-dashoffset:169.65;
  transition:stroke-dashoffset .45s cubic-bezier(.4,0,.2,1);
  filter:drop-shadow(0 0 5px rgba(0,113,227,.32));
  transform-box:fill-box;
  transform-origin:center;
}
/* 不定进度：弧长伸缩 + 整体旋转（Material / Apple 混合风格） */
.loader.indet .arc{
  animation:arc-spin 1.4s linear infinite,
            arc-grow 1.8s cubic-bezier(.65,.05,.36,1) infinite;
  transition:none;
}
@keyframes arc-spin{
  from{transform:rotate(0deg)}
  to  {transform:rotate(360deg)}
}
@keyframes arc-grow{
  0%  {stroke-dashoffset:139}
  45% {stroke-dashoffset:38}
  55% {stroke-dashoffset:38}
  100%{stroke-dashoffset:139}
}

.pct{
  font-size:12.5px;font-weight:600;color:var(--blue);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  opacity:0;transition:opacity .2s var(--ease);
}
.loader.has-pct .pct{opacity:1}
.loader.indet .pct{opacity:0}

.busy-tip{
  position:absolute;bottom:20px;left:12px;right:12px;text-align:center;
  font-size:12px;color:#6b7675;font-weight:500;
  letter-spacing:.01em;line-height:1.4;
  transition:opacity .2s var(--ease);
}

/* ───── 保存按钮 ───── */
.save{
  flex:none;
  width:100%;border:0;background:var(--blue);color:#fff;
  font-family:inherit;font-size:16.5px;font-weight:600;letter-spacing:-.01em;
  padding:15px 24px;border-radius:var(--r-pill);cursor:pointer;
  box-shadow:0 6px 20px rgba(0,113,227,.26);
  transition:transform .11s var(--ease),box-shadow .22s var(--ease),
             opacity .22s var(--ease),background .22s var(--ease);
  animation:in .5s var(--ease) .06s both;
}
.save:active:not(:disabled){transform:scale(.975);box-shadow:0 3px 10px rgba(0,113,227,.22)}
.save:disabled{opacity:1;background:#DEDEDA;color:#A6ACAC;box-shadow:none;cursor:default}
.save:focus-visible{outline:2px solid var(--focus);outline-offset:3px}

/* ───── 页脚 ───── */
.foot{
  flex:none;text-align:center;font-size:11px;color:var(--muted2);
  letter-spacing:.02em;padding-top:1px;
  animation:in .5s var(--ease) .1s both;
}
.foot b{font-weight:600;color:#9aa1a1}

/* ───── iOS 长按保存 ───── */
.ios{
  position:fixed;inset:0;z-index:70;display:none;
  background:rgba(20,26,26,.6);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  padding:calc(26px + env(safe-area-inset-top,0px)) 20px
          calc(20px + env(safe-area-inset-bottom,0px));
  flex-direction:column;align-items:center;justify-content:center;
  opacity:0;transition:opacity .24s var(--ease);
}
.ios.open{display:flex;opacity:1}
.ios .frame{
  background:#fff;border-radius:18px;padding:9px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
  max-width:min(76vw,290px);
}
.ios img{display:block;width:100%;border-radius:10px;
  -webkit-touch-callout:default;user-select:auto}
.ios .hint{
  color:#fff;font-size:15px;font-weight:500;margin-top:18px;text-align:center;
  line-height:1.5;text-shadow:0 1px 3px rgba(0,0,0,.3);
}
.ios .hint small{display:block;font-size:12.5px;opacity:.72;font-weight:400;margin-top:5px}
.ios .done{
  margin-top:18px;border:0;background:rgba(255,255,255,.94);color:var(--ink);
  font-family:inherit;font-size:15px;font-weight:600;padding:12px 34px;
  border-radius:var(--r-pill);cursor:pointer;
}

.toast{
  position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));
  z-index:80;transform:translate(-50%,12px);opacity:0;pointer-events:none;
  background:rgba(32,41,41,.93);color:#fff;font-size:13px;font-weight:500;
  padding:10px 18px;border-radius:var(--r-pill);white-space:nowrap;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  transition:opacity .24s var(--ease),transform .32s var(--spring);
  max-width:86vw;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 6px 22px rgba(0,0,0,.22);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes in{from{opacity:0;transform:translateY(8px)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0F1211;--ink:#EFF2F0;--card:#1A1E1D;--muted:#8B9391;
    --muted2:#6E7775;--line:#282D2C;--blue:#0A84FF;--blue-soft:#132434;
  }
  body{background:var(--paper)}
  .box{box-shadow:0 6px 22px rgba(0,0,0,.36)}
  .stage{background:radial-gradient(115% 100% at 32% 4%,#1E2625 0%,#171D1C 50%,#111615 100%)}
  .empty b{color:#DDE3E1}
  .empty svg{stroke:#5E6866}
  .save:disabled{background:#262B2A;color:#5A6361}
  .busy{background:rgba(20,24,23,.68)}
  .busy-tip{color:#98A2A0}
}
</style>
</head>
<body>

<div class="head">
  <h1 id="titleEl">图片压缩</h1>
  <span class="fmt">HEIC · JPG · PNG · WebP</span>
</div>

<section class="box">
  <div class="stage" id="stage">
    <div class="empty" id="empty">
      <svg viewBox="0 0 24 24">
        <rect x="2.5" y="5.5" width="19" height="14" rx="3.5"/>
        <circle cx="12" cy="12.5" r="3.6"/>
        <path d="M8.6 5.5 9.7 3.6h4.6l1.1 1.9"/>
      </svg>
      <b>上传图像</b>
      <span>轻点这里，拍照或从相册选</span>
    </div>
    <div class="crop" id="crop"></div>
    <div class="busy">
      <div class="loader indet">
        <svg class="ring" viewBox="0 0 64 64" aria-hidden="true">
          <circle class="track" cx="32" cy="32" r="27"></circle>
          <circle class="arc" id="arc" cx="32" cy="32" r="27"></circle>
        </svg>
        <span class="pct" id="pct"></span>
      </div>
      <div class="busy-tip" id="busyTip">处理中…</div>
    </div>
  </div>
</section>

<button class="save" id="saveBtn" disabled>保存头像</button>

<div class="foot">Power by <b>Muzi</b></div>

<input type="file" id="fileInput" accept="image/*,.heic,.heif,.avif,.webp,.bmp,.gif,.tif,.tiff" hidden>

<div class="ios" id="ios">
  <div class="frame"><img id="iosImg" alt="头像"></div>
  <div class="hint">长按上面这张图<small>选择「存储到照片」</small></div>
  <button class="done" id="iosDone">已保存</button>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  var LIMIT   = 45000;    // 留余量，网站硬上限 51200
  var OUT_DIM = 240;
  var MAX_SRC = 1400;

  function $(id){ return document.getElementById(id); }

  var stage   = $('stage');
  var emptyEl = $('empty');
  var input   = $('fileInput');
  var saveBtn = $('saveBtn');
  var toastEl = $('toast');
  var cropEl  = $('crop');
  var busyTip = $('busyTip');

  var preview = null, work = null, srcImgRef = null;
  var srcW = 0, srcH = 0;
  var baseScale = 1, zoom = 1, offX = 0, offY = 0, stageW = 1, stageH = 1;
  var cropSide = 1, cropLeft = 0, cropTop = 0;
  var result = null, busy = false, lastFile = null;

  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isStandalone = window.navigator.standalone === true;

  /* ═══════════ toast ═══════════ */
  var tTimer;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(tTimer);
    tTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2400);
  }

  function tip(t){ busyTip.textContent = t; }

  /* 进度：p 为 0..1；传 null 表示未知进度（伸缩弧） */
  var arcEl = null, pctEl = null, loaderEl = null;
  function progress(p){
    if (!arcEl){
      arcEl = document.getElementById('arc');
      pctEl = document.getElementById('pct');
      loaderEl = arcEl ? arcEl.closest('.loader') : null;
    }
    if (!arcEl || !loaderEl) return;

    if (p === null || p === undefined){
      loaderEl.classList.add('indet');
      loaderEl.classList.remove('has-pct');
      return;
    }
    loaderEl.classList.remove('indet');
    loaderEl.classList.add('has-pct');
    var clamped = Math.max(0, Math.min(1, p));
    var C = 169.65;
    arcEl.style.strokeDashoffset = (C * (1 - clamped)).toFixed(1);
    pctEl.textContent = Math.round(clamped * 100) + '%';
  }

  /* ═══════════ 依赖按需加载（多源 + 完整性校验） ═══════════ */
  var loaded = {};

  // 本页所在目录（兼容根站 / 子目录 / file:// 三种部署）
  var SITE_BASE = (function(){
    var u = location.pathname;
    if (/\/index\.html$/.test(u)) return u.replace(/index\.html$/, '');
    if (/\/$/.test(u)) return u;
    return u.replace(/[^/]*$/, '');
  })();
  var HEIF_BASE = SITE_BASE + 'lib/heif/';

  // 多源：优先走带压缩的 CDN，最后回落自家
  var SOURCES = {
    'libheif': [
      'https://cdn.jsdelivr.net/npm/libheif-js@1.23.5/libheif-wasm/libheif-bundle.js',
      'https://unpkg.com/libheif-js@1.23.5/libheif-wasm/libheif-bundle.js',
      'https://cdn.staticfile.org/libheif-js/1.23.5/libheif-wasm/libheif-bundle.js',
      SITE_BASE + 'lib/libheif-bundle.js'
    ],
    'pako': [
      'https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/browser/pako.umd.min.js',
      'https://unpkg.com/pako@2.1.0/dist/browser/pako.umd.min.js',
      SITE_BASE + 'lib/pako.min.js'
    ],
    'utif': [
      'https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.js',
      'https://unpkg.com/utif@3.1.0/UTIF.js',
      SITE_BASE + 'lib/UTIF.js'
    ]
  };

  function injectScript(url, timeoutMs){
    return new Promise(function(resolve, reject){
      var el = document.createElement('script');
      el.src = url;
      el.async = true;
      var done = false;
      var timer = setTimeout(function(){
        if (!done){ done = true; el.remove(); reject(new Error('timeout')); }
      }, timeoutMs || 25000);
      el.onload = function(){
        if (!done){ done = true; clearTimeout(timer); resolve(); }
      };
      el.onerror = function(){
        if (!done){ done = true; clearTimeout(timer); el.remove(); reject(new Error('error')); }
      };
      document.head.appendChild(el);
    });
  }

  // 依次尝试每个源，直到 check() 返回真
  async function loadWithSources(key, check, label){
    if (loaded[key]) return loaded[key];
    loaded[key] = (async function(){
      var urls = SOURCES[key];
      var lastErr = null;
      var total = urls.length * 2;
      var step = 0;
      for (var i = 0; i < urls.length; i++){
        for (var attempt = 0; attempt < 2; attempt++){
          step++;
          tip(label + '…');
          progress(0.05 + 0.40 * (step - 1) / total);
          try{
            await injectScript(urls[i], 30000);
            if (check()){ progress(0.5); return true; }
            throw new Error('check failed');
          }catch(e){
            lastErr = e;
          }
        }
      }
      throw lastErr || new Error('all sources failed');
    })().catch(function(e){
      loaded[key] = null;
      throw e;
    });
    return loaded[key];
  }

  /* ═══════════ HEIC / HEIF ═══════════ */
  var heifPromise = null;

  function fetchText(url, tries){
    var n = tries == null ? 4 : tries;
    return new Promise(function(resolve, reject){
      var attempt = 0;
      function once(){
        attempt++;
        var xhr = new XMLHttpRequest();
        var sep = url.indexOf('?') < 0 ? '?' : '&';
        xhr.open('GET', attempt > 1 ? url + sep + 'r=' + attempt : url, true);
        xhr.timeout = 20000;
        xhr.onload = function(){
          if (xhr.status >= 200 && xhr.status < 300 && xhr.responseText.length > 0){
            resolve(xhr.responseText);
          } else if (attempt < n){ setTimeout(once, 300 * attempt); }
          else { reject(new Error('fetch fail')); }
        };
        xhr.onerror = xhr.ontimeout = function(){
          if (attempt < n) setTimeout(once, 300 * attempt);
          else reject(new Error('fetch fail'));
        };
        xhr.send();
      }
      once();
    });
  }

  // 最终保底：分块拉取 base64 再拼装（抗弱网断流）
  async function loadHeifChunks(){
    var base = HEIF_BASE;
    var mf = await fetchText(base + 'manifest.json', 3);
    var lens = JSON.parse(mf).parts;
    var b64 = '';
    for (var i = 0; i < lens.length; i++){
      progress(0.1 + 0.4 * i / lens.length);
      var piece = null;
      for (var retry = 0; retry < 6 && piece === null; retry++){
        try{
          var t = await fetchText(base + 'p' + i + '.txt', 3);
          t = (t || '').replace(/\s+/g, '');
          if (t.length === lens[i]) piece = t;
        }catch(e){ /* retry */ }
      }
      if (piece === null) throw new Error('chunk ' + i + ' failed');
      b64 += piece;
    }
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
    var code = new TextDecoder('utf-8').decode(bytes);
    if (code.indexOf('HeifDecoder') < 0) throw new Error('bundle corrupted');
    (0, eval)(code + '\n//# sourceURL=libheif-bundle.js');
  }

  function getHeif(){
    if (heifPromise) return heifPromise;
    heifPromise = (async function(){
      if (typeof libheif === 'undefined'){
        try{
          await loadWithSources('libheif',
            function(){ return typeof libheif !== 'undefined'; },
            '加载 HEIC 解码器');
        }catch(e){
          // CDN 全挂 → 分块兜底
          if (typeof libheif === 'undefined'){
            tip('切换备用下载…');
            await loadHeifChunks();
          }
        }
      }
      if (typeof libheif === 'undefined') throw new Error('no libheif');

      var L = (typeof libheif === 'function') ? await libheif() : libheif;
      if (!L || !L.HeifDecoder) throw new Error('no HeifDecoder');
      return L;
    })().catch(function(e){
      heifPromise = null;
      throw e;
    });
    return heifPromise;
  }

  async function decodeHeif(file){
    tip('解码 HEIC…');
    progress(0.25);
    var L = await getHeif();
    progress(0.5);

    var buf = new Uint8Array(await file.arrayBuffer());
    var dec = new L.HeifDecoder();
    var imgs = dec.decode(buf);
    if (!imgs || !imgs.length) throw new Error('heif empty');

    var img = imgs[0];
    var w = img.get_width(), h = img.get_height();
    if (!w || !h) throw new Error('heif size');

    var data = new Uint8ClampedArray(w * h * 4);
    await new Promise(function(resolve, reject){
      var done = false;
      var timer = setTimeout(function(){
        if (!done){ done = true; reject(new Error('heif timeout')); }
      }, 25000);
      try{
        img.display({ data: data, width: w, height: h }, function(){
          if (!done){ done = true; clearTimeout(timer); resolve(); }
        });
      }catch(e){
        if (!done){ done = true; clearTimeout(timer); reject(e); }
      }
    });
    progress(0.8);

    var full = document.createElement('canvas');
    full.width = w; full.height = h;
    var fx = full.getContext('2d');
    var id = fx.createImageData(w, h);
    id.data.set(data);
    fx.putImageData(id, 0, 0);

    var k = Math.min(1, MAX_SRC / Math.max(w, h));
    if (k >= 1) return full;
    var ow = Math.max(1, Math.round(w * k));
    var oh = Math.max(1, Math.round(h * k));
    var c = document.createElement('canvas');
    c.width = ow; c.height = oh;
    var cx = c.getContext('2d');
    cx.imageSmoothingQuality = 'high';
    cx.drawImage(full, 0, 0, ow, oh);
    return c;
  }

  /* ═══════════ TIFF ═══════════ */
  var tiffPromise = null;

  function getTiff(){
    if (tiffPromise) return tiffPromise;
    tiffPromise = (async function(){
      await loadWithSources('pako',
        function(){ return typeof pako !== 'undefined'; },
        '加载 TIFF 组件');
      await loadWithSources('utif',
        function(){ return typeof UTIF !== 'undefined'; },
        '加载 TIFF 解码器');
      return true;
    })().catch(function(e){ tiffPromise = null; throw e; });
    return tiffPromise;
  }

  async function decodeTiff(file){
    tip('解码 TIFF…');
    progress(0.2);
    await getTiff();
    progress(0.45);

    var buf = await file.arrayBuffer();
    var ifds = UTIF.decode(buf);
    if (!ifds || !ifds.length) throw new Error('tiff empty');

    for (var i = 0; i < ifds.length; i++){
      try{
        UTIF.decodeImage(buf, ifds[i]);
        var rgba = UTIF.toRGBA8(ifds[i]);
        var w = ifds[i].width, h = ifds[i].height;
        if (!w || !h || !rgba || !rgba.length) continue;

        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var cx = c.getContext('2d');
        var id = cx.createImageData(w, h);
        id.data.set(rgba);
        cx.putImageData(id, 0, 0);

        var k = Math.min(1, MAX_SRC / Math.max(w, h));
        if (k >= 1) return c;
        var ow = Math.max(1, Math.round(w * k)), oh = Math.max(1, Math.round(h * k));
        var c2 = document.createElement('canvas');
        c2.width = ow; c2.height = oh;
        var c2x = c2.getContext('2d');
        c2x.imageSmoothingQuality = 'high';
        c2x.drawImage(c, 0, 0, ow, oh);
        return c2;
      }catch(e){ /* 下一个 IFD */ }
    }
    throw new Error('tiff decode failed');
  }

  /* ═══════════ 通用解码链 ═══════════ */
  function isHeif(file){
    var n = (file.name || '').toLowerCase();
    var t = (file.type || '').toLowerCase();
    return /\.(heic|heif)$/.test(n) || /heic|heif/.test(t);
  }

  function isTiff(file){
    var n = (file.name || '').toLowerCase();
    var t = (file.type || '').toLowerCase();
    return /\.(tiff?)$/.test(n) || /tiff/.test(t);
  }

  async function viaBitmap(file){
    if (!window.createImageBitmap) throw new Error('no createImageBitmap');
    try{
      return await createImageBitmap(file, { imageOrientation:'from-image' });
    }catch(e){
      return await createImageBitmap(file);
    }
  }

  function viaImg(file){
    return new Promise(function(res, rej){
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function(){
        setTimeout(function(){ URL.revokeObjectURL(url); }, 0);
        res(img);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('img')); };
      img.src = url;
    });
  }

  async function decodeAny(file){
    var order = [];
    if (isHeif(file)) order.push(decodeHeif);
    if (isTiff(file)) order.push(decodeTiff);
    order.push(viaBitmap, viaImg);
    if (!isHeif(file)) order.push(decodeHeif);
    if (!isTiff(file)) order.push(decodeTiff);

    var lastErr = null;
    for (var i=0;i<order.length;i++){
      try{
        var r = await order[i](file);
        if (r) return r;
      }catch(e){ lastErr = e; }
    }
    throw lastErr || new Error('decode');
  }

  /* ═══════════ 尺寸 ═══════════ */
  function measure(){
    var r = stage.getBoundingClientRect();
    stageW = r.width  || 300;
    stageH = r.height || 300;

    var pad = Math.round(Math.min(stageW, stageH) * 0.055) + 6;
    cropSide = Math.max(40, Math.min(stageW, stageH) - pad * 2);
    cropLeft = (stageW - cropSide) / 2;
    cropTop  = (stageH - cropSide) / 2;

    cropEl.style.width  = cropSide + 'px';
    cropEl.style.height = cropSide + 'px';
    cropEl.style.left   = cropLeft + 'px';
    cropEl.style.top    = cropTop + 'px';
  }

  function layout(clamp){
    if (!work || !preview) return;
    var k = baseScale * zoom;
    var dw = srcW * k, dh = srcH * k;

    var maxX = Math.max(0, (dw - cropSide) / 2);
    var maxY = Math.max(0, (dh - cropSide) / 2);
    if (clamp){
      offX = Math.max(-maxX, Math.min(maxX, offX));
      offY = Math.max(-maxY, Math.min(maxY, offY));
    }
    var left = (stageW - dw) / 2 + offX;
    var top  = (stageH - dh) / 2 + offY;

    preview.style.width  = dw + 'px';
    preview.style.height = dh + 'px';
    preview.style.transform = 'translate3d(' + left.toFixed(2) + 'px,' +
                              top.toFixed(2) + 'px,0)';
  }

  /* ═══════════ 画到舞台 ═══════════ */
  function paint(source){
    measure();
    var sw = source.width  || source.naturalWidth;
    var sh = source.height || source.naturalHeight;

    var k = Math.min(1, MAX_SRC / Math.max(sw, sh));
    var cw = Math.max(1, Math.round(sw * k));
    var ch = Math.max(1, Math.round(sh * k));

    var c = document.createElement('canvas');
    c.width = cw; c.height = ch;
    var cx = c.getContext('2d');
    cx.imageSmoothingQuality = 'high';
    cx.drawImage(source, 0, 0, cw, ch);
    work = c;

    if (!preview){
      var nc = document.createElement('canvas');
      nc.style.cssText = 'position:absolute;top:0;left:0;z-index:1;' +
        'transform-origin:0 0;will-change:transform;user-select:none;display:block;';
      stage.appendChild(nc);
      preview = nc;
    }
    preview.width = cw; preview.height = ch;
    var pc = preview.getContext('2d');
    pc.clearRect(0, 0, cw, ch);
    pc.drawImage(work, 0, 0);
    preview.style.display = 'block';

    srcW = cw; srcH = ch;
    baseScale = Math.max(cropSide / srcW, cropSide / srcH);
    zoom = 1; offX = 0; offY = 0;

    stage.classList.add('filled');
    layout(false);
  }

  /* ═══════════ 手势 ═══════════ */
  var ptrs = new Map(), dragging = false, lx = 0, ly = 0,
      pinch0 = 0, pinchZ = 1, tapX = 0, tapY = 0, tapMoved = false;

  stage.addEventListener('pointerdown', function(e){
    if (!work) return;
    ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
    try{ stage.setPointerCapture(e.pointerId); }catch(err){}
    if (ptrs.size === 1){
      dragging = true; lx = e.clientX; ly = e.clientY;
      tapX = e.clientX; tapY = e.clientY; tapMoved = false;
    } else if (ptrs.size === 2){
      dragging = false;
      var p = Array.from(ptrs.values());
      pinch0 = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y) || 1;
      pinchZ = zoom;
    }
  });

  stage.addEventListener('pointermove', function(e){
    if (!work || !ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });

    if (ptrs.size >= 2){
      var p = Array.from(ptrs.values());
      var d = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
      if (pinch0 > 0 && d > 0){
        zoom = Math.max(1, Math.min(4, pinchZ * (d / pinch0)));
        layout(true);
      }
      e.preventDefault();
      return;
    }
    if (dragging){
      offX += e.clientX - lx;
      offY += e.clientY - ly;
      lx = e.clientX; ly = e.clientY;
      if (Math.hypot(e.clientX - tapX, e.clientY - tapY) > 6) tapMoved = true;
      layout(true);
      e.preventDefault();
    }
  }, { passive:false });

  function up(e){
    ptrs.delete(e.pointerId);
    if (ptrs.size === 0) dragging = false;
    if (ptrs.size < 2) pinch0 = 0;
    if (ptrs.size === 0){
      if (work && !tapMoved){
        input.click();              // 轻点 = 换一张
      } else if (work){
        scheduleRebuild();
      }
    }
  }
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);

  stage.addEventListener('wheel', function(e){
    if (!work) return;
    e.preventDefault();
    zoom = Math.max(1, Math.min(4, zoom * (1 - e.deltaY * 0.0015)));
    layout(true);
    scheduleRebuild();
  }, { passive:false });

  /* ═══════════ 裁切 ═══════════ */
  function drawCrop(side){
    var k = baseScale * zoom;
    var left = (stageW - srcW * k) / 2 + offX;
    var top  = (stageH - srcH * k) / 2 + offY;

    var sx = (cropLeft - left) / k;
    var sy = (cropTop  - top ) / k;
    var sq = cropSide / k;

    sx = Math.max(0, Math.min(Math.max(0, srcW - sq), sx));
    sy = Math.max(0, Math.min(Math.max(0, srcH - sq), sy));

    var c = document.createElement('canvas');
    c.width = side; c.height = side;
    var cx = c.getContext('2d');
    cx.fillStyle = '#ffffff';
    cx.fillRect(0, 0, side, side);
    cx.imageSmoothingQuality = 'high';
    cx.drawImage(work, sx, sy, sq, sq, 0, 0, side, side);
    return c;
  }

  function toBlob(canvas, q){
    return new Promise(function(res){
      if (canvas.toBlob){
        canvas.toBlob(function(b){ res(b); }, 'image/jpeg', q);
      } else {
        try{
          var d = canvas.toDataURL('image/jpeg', q);
          var bin = atob(d.split(',')[1]);
          var u8 = new Uint8Array(bin.length);
          for (var i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
          res(new Blob([u8], { type:'image/jpeg' }));
        }catch(err){ res(null); }
      }
    });
  }

  async function compress(){
    if (!work) return null;
    var dim = OUT_DIM, smallest = null;
    for (var round = 0; round < 9; round++){
      var c = drawCrop(dim);
      for (var q = 0.90; q >= 0.29; q -= 0.055){
        var b = await toBlob(c, q);
        if (!b) continue;
        if (b.size <= LIMIT) return { blob:b, dim:dim };
        if (!smallest || b.size < smallest.blob.size)
          smallest = { blob:b, dim:dim };
      }
      dim = Math.round(dim * 0.84);
      if (dim < 72) break;
    }
    return smallest;
  }

  var rebuildTimer;
  function scheduleRebuild(){
    clearTimeout(rebuildTimer);
    rebuildTimer = setTimeout(function(){ rebuild(); }, 180);
  }

  async function rebuild(){
    if (!work) return;
    if (busy){
      clearTimeout(rebuildTimer);
      rebuildTimer = setTimeout(function(){ rebuild(); }, 220);
      return;
    }
    busy = true;
    stage.classList.add('processing');
    progress(null);
    tip('压缩中…');
    saveBtn.disabled = true;
    try{
      var r = await compress();
      if (!r) throw new Error('encode');
      if (result && result.url) URL.revokeObjectURL(result.url);

      var url  = URL.createObjectURL(r.blob);
      var name = 'image-' + r.dim + 'x' + r.dim + '-' + r.blob.size + 'B.jpg';
      var file;
      try{ file = new File([r.blob], name, { type:'image/jpeg' }); }
      catch(e){ file = r.blob; file.name = name; }

      result = { blob:r.blob, url:url, file:file, size:r.blob.size, dim:r.dim };
      saveBtn.disabled = false;
    }catch(e){
      toast('处理失败，换一张试试');
    }finally{
      busy = false;
      stage.classList.remove('processing');
      progress(0);
    }
  }

  /* ═══════════ 选图 ═══════════ */
  async function accept(file){
    if (!file) return;
    lastFile = file;
    var looks = /^image\//.test(file.type || '') ||
      /\.(jpe?g|png|webp|bmp|gif|heic|heif|avif|tiff?|jfif)$/i.test(file.name || '');
    if (!looks){ toast('这不是图片'); return; }

    stage.classList.add('processing');
    progress(null);
    tip(isHeif(file) ? '解码 HEIC…' : '读取中…');
    saveBtn.disabled = true;

    var src;
    try{
      src = await decodeAny(file);
    }catch(e){
      stage.classList.remove('processing');
      progress(0);
      var n = (file.name || '').toLowerCase();
      var why = (e && e.message) ? e.message : String(e);
      console.warn('[解码失败]', why, file.type, file.size);
      if (/tiff?|psd|raw|cr2|nef|arw|dng/.test(n)){
        toast('专业格式解不开，先用相册「编辑→保存」转一次');
      } else if (/load fail|timeout|fetch|all sources/.test(why)){
        toast('解码组件下载失败，检查网络后再试');
      } else if (/heif/i.test(why)){
        toast('这张 HEIC 解不开，试试截个图再选');
      } else {
        toast('这张图解不开，截个图再选也行');
      }
      return;
    }

    stage.classList.remove('processing');
    srcImgRef = src;
    paint(src);
    await rebuild();
  }

  input.addEventListener('change', function(e){
    if (e.target.files && e.target.files[0]) accept(e.target.files[0]);
    e.target.value = '';
  });

  stage.addEventListener('click', function(){
    if (!work) input.click();
  });

  ['dragenter','dragover'].forEach(function(ev){
    stage.addEventListener(ev, function(e){ e.preventDefault(); });
  });
  stage.addEventListener('drop', function(e){
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) accept(f);
  });

  // 粘贴（电脑上用）
  window.addEventListener('paste', function(e){
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (var i=0;i<items.length;i++){
      if (items[i].type && items[i].type.indexOf('image') === 0){
        var f = items[i].getAsFile();
        if (f){ accept(f); break; }
      }
    }
  });

  /* ═══════════ 保存 ═══════════ */
  function saveDownload(){
    var a = document.createElement('a');
    a.href = result.url;
    a.download = result.file.name || 'image.jpg';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('已保存');
  }

  saveBtn.addEventListener('click', function(){
    if (!result) return;
    if (isIOS && !isStandalone){
      $('iosImg').src = result.url;
      $('ios').classList.add('open');
    } else {
      saveDownload();
    }
  });

  $('iosDone').addEventListener('click', function(){
    $('ios').classList.remove('open');
    toast('去网站上传吧');
  });
  $('ios').addEventListener('click', function(e){
    if (e.target === this) this.classList.remove('open');
  });

  /* ═══════════ 尺寸变化 ═══════════ */
  var rt;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){
      if (!work) return;
      var oW = stageW, oH = stageH;
      measure();
      if (oW > 1 && oH > 1){
        offX *= stageW / oW;
        offY *= stageH / oH;
        baseScale = Math.max(cropSide / srcW, cropSide / srcH);
        layout(true);
      }
    }, 150);
  });

  /* ═══════════ 启动 ═══════════ */
  window.progress = progress;

  // 长按标题 1.2 秒 → 显示诊断信息（排障用，普通用户碰不到）
  (function(){
    var t = document.getElementById('titleEl');
    if (!t) return;
    var timer = null;
    function start(){
      clearTimeout(timer);
      timer = setTimeout(function(){
        var lines = [
          '触发：' + (lastFile ? lastFile.name + ' / ' + (lastFile.type||'?') + ' / ' + Math.round(lastFile.size/1024) + 'KB' : '无'),
          'HEIC解码器：' + (typeof libheif !== 'undefined' ? (heifPromise ? '已加载' : '已就绪') : '未加载'),
          'TIFF解码器：' + (typeof UTIF !== 'undefined' ? '已加载' : '未加载'),
          '输出：' + (result ? result.dim + '×' + result.dim + ' / ' + result.size + 'B' : '无'),
          'UA：' + navigator.userAgent.slice(0, 60)
        ];
        alert(lines.join('\n'));
      }, 1200);
    }
    t.addEventListener('pointerdown', start);
    ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
      t.addEventListener(ev, function(){ clearTimeout(timer); });
    });
  })();

  function init(){ measure(); }
  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
  window.addEventListener('load', function(){ measure(); layout(false); });

})();
</script>
</body>
</html>
